spring.application.name=examensarbete

# PostgreSQL databasinställningar
spring.datasource.url=jdbc:postgresql://localhost:5432/examensarbete
spring.datasource.username=eddie
spring.datasource.password=examensarbete
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate inställningar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
